<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกและวิเคราะห์การให้น้ำปุ๋ย กัญชา (COCO)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans p-4 max-w-lg mx-auto">
    <div class="bg-white shadow-md rounded-xl p-6 mb-6">
        <h1 class="text-xl font-bold text-emerald-700 mb-4 text-center">🌿 บันทึกการให้ปุ๋ยกัญชา</h1>
        
        <form id="nutrientForm" class="space-y-4">
            <!-- ผู้บันทึก -->
            <div>
                <label class="block text-sm font-medium text-gray-700">ชื่อผู้บันทึก *</label>
                <input type="text" id="recorderName" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-emerald-500 focus:border-emerald-500" placeholder="ระบุชื่อของคุณ">
            </div>

            <!-- ช่วงการเติบโต -->
            <div>
                <label class="block text-sm font-medium text-gray-700">ช่วงการเติบโต</label>
                <select id="growthStage" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    <option value="ต้นแม่ (Mother Plant)">ต้นแม่ (Mother Plant)</option>
                    <option value="ทำใบ (Vegetative)">ทำใบ (Vegetative)</option>
                    <option value="ทำดอก (Flowering)" selected>ทำดอก (Flowering)</option>
                </select>
            </div>

            <!-- ข้อมูลน้ำเข้า -->
            <div class="grid grid-cols-2 gap-4 bg-emerald-50 p-3 rounded-lg">
                <div>
                    <label class="block text-xs font-semibold text-emerald-800">EC น้ำเข้า (Inflow)</label>
                    <input type="number" step="0.1" id="inflowEC" required class="mt-1 block w-full rounded border-gray-300 border p-1.5" placeholder="3.0">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-emerald-800">pH น้ำเข้า (Inflow)</label>
                    <input type="number" step="0.1" id="inflowPH" required class="mt-1 block w-full rounded border-gray-300 border p-1.5" placeholder="6.2">
                </div>
            </div>

            <!-- ค่า Run-off 3-5 จุด -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ค่า Run-off (วัด 3-5 จุด)</label>
                <div id="runoffContainer" class="space-y-2">
                    <!-- จุดที่ 1 -->
                    <div class="flex gap-2 items-center">
                        <span class="text-xs text-gray-500 w-12">จุด 1</span>
                        <input type="number" step="0.1" placeholder="EC" class="runoff-ec w-1/2 border p-1.5 rounded text-sm" required>
                        <input type="number" step="0.1" placeholder="pH" class="runoff-ph w-1/2 border p-1.5 rounded text-sm" required>
                    </div>
                    <!-- จุดที่ 2 -->
                    <div class="flex gap-2 items-center">
                        <span class="text-xs text-gray-500 w-12">จุด 2</span>
                        <input type="number" step="0.1" placeholder="EC" class="runoff-ec w-1/2 border p-1.5 rounded text-sm" required>
                        <input type="number" step="0.1" placeholder="pH" class="runoff-ph w-1/2 border p-1.5 rounded text-sm" required>
                    </div>
                    <!-- จุดที่ 3 -->
                    <div class="flex gap-2 items-center">
                        <span class="text-xs text-gray-500 w-12">จุด 3</span>
                        <input type="number" step="0.1" placeholder="EC" class="runoff-ec w-1/2 border p-1.5 rounded text-sm" required>
                        <input type="number" step="0.1" placeholder="pH" class="runoff-ph w-1/2 border p-1.5 rounded text-sm" required>
                    </div>
                </div>
                <button type="button" onclick="addRunoffPoint()" class="mt-2 text-xs text-emerald-600 font-semibold hover:underline">+ เพิ่มจุดวัด (สูงสุด 5 จุด)</button>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-emerald-600 text-white font-bold p-3 rounded-lg shadow hover:bg-emerald-700 transition">
                บันทึกและให้ AI วิเคราะห์ 🤖
            </button>
        </form>
    </div>

    <!-- ผลลัพธ์การวิเคราะห์จาก AI -->
    <div id="resultBox" class="hidden bg-white shadow-md rounded-xl p-6 border-l-4 border-emerald-500">
        <h2 class="font-bold text-gray-800 mb-2">📊 ผลวิเคราะห์ & คำแนะนำจาก AI</h2>
        <div id="aiResponseText" class="text-sm text-gray-600 whitespace-pre-line bg-gray-50 p-3 rounded-lg"></div>
    </div>

    <script>
        function addRunoffPoint() {
            const container = document.getElementById('runoffContainer');
            const count = container.children.length + 1;
            if (count > 5) return alert('จำกัดสูงสุด 5 จุดครับ');
            
            const div = document.createElement('div');
            div.className = 'flex gap-2 items-center';
            div.innerHTML = `
                <span class="text-xs text-gray-500 w-12">จุด ${count}</span>
                <input type="number" step="0.1" placeholder="EC" class="runoff-ec w-1/2 border p-1.5 rounded text-sm" required>
                <input type="number" step="0.1" placeholder="pH" class="runoff-ph w-1/2 border p-1.5 rounded text-sm" required>
            `;
            container.appendChild(div);
        }

        document.getElementById('nutrientForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'กำลังให้ AI วิเคราะห์และบันทึก... ⏳';

            // รวบรวมข้อมูลค่า Run-off ทั้งหมด
            const ecInputs = document.querySelectorAll('.runoff-ec');
            const phInputs = document.querySelectorAll('.runoff-ph');
            let runoffList = [];
            for(let i=0; i<ecInputs.length; i++) {
                runoffList.push({ point: i+1, ec: ecInputs[i].value, ph: phInputs[i].value });
            }

            const payload = {
                recorder: document.getElementById('recorderName').value,
                stage: document.getElementById('growthStage').value,
                inflowEC: document.getElementById('inflowEC').value,
                inflowPH: document.getElementById('inflowPH').value,
                runoff: runoffList
            };

            try {
                // แทนที่ URL ด้านล่างด้วย URL ของ Cloudflare Worker ของคุณ
                const response = await fetch('https://cannabis-api.doibudgrower145.workers.dev/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                
                document.getElementById('resultBox').classList.remove('hidden');
                document.getElementById('aiResponseText').innerText = result.aiAnalysis;
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อระบบ');
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerText = 'บันทึกและให้ AI วิเคราะห์ 🤖';
            }
        });
    </script>
</body>
</html>
