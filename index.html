<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกและวิเคราะห์การให้น้ำปุ๋ย</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- นำเข้าไลบรารี html2canvas สำหรับแปลง HTML เป็นรูปภาพ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-slate-50 font-sans p-4 max-w-lg mx-auto">
    
    <!-- ครอบพื้นที่ทั้งหมดตั้งแต่หัวข้อฟอร์มจนถึงผลวิเคราะห์ด้วย id="captureArea" -->
    <div id="captureArea" class="bg-white shadow-md rounded-xl p-6 mb-4 space-y-4">
        <h1 class="text-xl font-bold text-emerald-700 mb-2 text-center">🌿 บันทึกการให้ปุ๋ยรายวัน</h1>
        
        <form id="nutrientForm" class="space-y-4">
            <!-- ผู้บันทึก -->
            <div>
                <label class="block text-sm font-medium text-gray-700">ชื่อผู้บันทึก *</label>
                <input type="text" id="recorderName" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 bg-gray-50 focus:ring-emerald-500 focus:border-emerald-500" placeholder="ระบุชื่อของคุณ">
            </div>

            <!-- ช่วงการเติบโต -->
            <div>
                <label class="block text-sm font-medium text-gray-700">ช่วงการเติบโต *</label>
                <select id="growthStage" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 bg-gray-50">
                    <option value="" disabled selected>-- กรุณาเลือกช่วงการเติบโต --</option>
                    <option value="ต้นแม่ (Mother Plant)">ต้นแม่ (Mother Plant)</option>
                    <option value="ทำใบ (Vegetative)">ทำใบ (Vegetative)</option>
                    <option value="ทำดอก (Flowering)">ทำดอก (Flowering)</option>
                </select>
            </div>

            <!-- ข้อมูลน้ำเข้า -->
            <div class="grid grid-cols-2 gap-4 bg-emerald-50 p-3 rounded-lg border border-emerald-100">
                <div>
                    <label class="block text-xs font-semibold text-emerald-800">EC น้ำเข้า (Inflow)</label>
                    <input type="number" step="0.1" id="inflowEC" required class="mt-1 block w-full rounded border-gray-300 border p-1.5 bg-white" placeholder="3.0">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-emerald-800">pH น้ำเข้า (Inflow)</label>
                    <input type="number" step="0.1" id="inflowPH" required class="mt-1 block w-full rounded border-gray-300 border p-1.5 bg-white" placeholder="6.2">
                </div>
            </div>

            <!-- ค่า Run-off สูงสุด 10 จุด -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-sm font-medium text-gray-700">ค่า Run-off (วัดได้สูงสุด 10 จุด)</label>
                    <span id="pointCountText" class="text-xs text-emerald-600 font-semibold">3 / 10 จุด</span>
                </div>
                <div id="runoffContainer" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                    <div class="flex gap-2 items-center">
                        <span class="text-xs text-gray-500 w-12">จุด 1</span>
                        <input type="number" step="0.1" placeholder="EC" class="runoff-ec w-1/2 border p-1.5 rounded text-sm bg-white" required>
                        <input type="number" step="0.1" placeholder="pH" class="runoff-ph w-1/2 border p-1.5 rounded text-sm bg-white" required>
                    </div>
                    <div class="flex gap-2 items-center">
                        <span class="text-xs text-gray-500 w-12">จุด 2</span>
                        <input type="number" step="0.1" placeholder="EC" class="runoff-ec w-1/2 border p-1.5 rounded text-sm bg-white" required>
                        <input type="number" step="0.1" placeholder="pH" class="runoff-ph w-1/2 border p-1.5 rounded text-sm bg-white" required>
                    </div>
                    <div class="flex gap-2 items-center">
                        <span class="text-xs text-gray-500 w-12">จุด 3</span>
                        <input type="number" step="0.1" placeholder="EC" class="runoff-ec w-1/2 border p-1.5 rounded text-sm bg-white" required>
                        <input type="number" step="0.1" placeholder="pH" class="runoff-ph w-1/2 border p-1.5 rounded text-sm bg-white" required>
                    </div>
                </div>
                <button type="button" id="btnAddPoint" onclick="addRunoffPoint()" class="mt-2 text-xs text-emerald-600 font-semibold hover:underline">+ เพิ่มจุดวัด (สูงสุด 10 จุด)</button>
            </div>
        </form>

        <!-- ผลลัพธ์การวิเคราะห์จาก AI (อยู่ในกรอบรูปเดียวกัน) -->
        <div id="resultBox" class="hidden pt-4 border-t border-gray-200">
            <!-- ย้ายปุ่มดาวน์โหลดมาไว้ตรงหัวข้อผลวิเคราะห์ กดปุ๊บติดภาพทันที -->
            <div class="flex justify-between items-center mb-2">
                <h2 id="resultTitle" class="font-bold text-gray-800">📊 ผลวิเคราะห์จาก AI</h2>
                <button type="button" id="btnDownloadImg" onclick="downloadResultImage()" class="bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded shadow hover:bg-blue-700 transition flex items-center gap-1">
                    📥 ดาวน์โหลดรูปภาพ
                </button>
            </div>
            <div id="aiResponseText" class="text-sm text-gray-600 whitespace-pre-line bg-gray-50 p-3 rounded-lg border border-gray-100"></div>
        </div>

        <!-- เครดิตในรูปภาพ -->
        <div class="text-right text-[10px] text-gray-400 pt-2">
            Developed by <span class="font-semibold text-emerald-600">NRSN | Doibud CO.,LTD.</span>
        </div>
    </div>

    <!-- ปุ่มกดทำงานหลัก (แยกอยู่นอกกรอบรูป) -->
    <div class="space-y-2 mb-8">
        <button type="button" onclick="submitData('normal')" id="btnNormal" class="w-full bg-emerald-600 text-white font-bold p-3 rounded-lg shadow hover:bg-emerald-700 transition">
            📝 บันทึก & วิเคราะห์รอบนี้ (รอบปกติ)
        </button>
        <button type="button" onclick="submitData('final')" id="btnFinal" class="w-full bg-amber-600 text-white font-bold p-3 rounded-lg shadow hover:bg-amber-700 transition">
            🤖 บันทึกรอบสุดท้าย & สรุปภาพรวมรายวัน (วางแผนพรุ่งนี้)
        </button>
    </div>

    <script>
        function updatePointCount() {
            const container = document.getElementById('runoffContainer');
            const count = container.children.length;
            document.getElementById('pointCountText').innerText = `${count} / 10 จุด`;
        }

        function addRunoffPoint() {
            const container = document.getElementById('runoffContainer');
            const count = container.children.length + 1;
            if (count > 10) return alert('จำกัดสูงสุด 10 จุดครับ');
            
            const div = document.createElement('div');
            div.className = 'flex gap-2 items-center';
            div.innerHTML = `
                <span class="text-xs text-gray-500 w-12">จุด ${count}</span>
                <input type="number" step="0.1" placeholder="EC" class="runoff-ec w-1/2 border p-1.5 rounded text-sm bg-white" required>
                <input type="number" step="0.1" placeholder="pH" class="runoff-ph w-1/2 border p-1.5 rounded text-sm bg-white" required>
            `;
            container.appendChild(div);
            updatePointCount();
        }

        async function submitData(analysisType) {
            const form = document.getElementById('nutrientForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const btnNormal = document.getElementById('btnNormal');
            const btnFinal = document.getElementById('btnFinal');
            
            btnNormal.disabled = true;
            btnFinal.disabled = true;

            if (analysisType === 'normal') {
                btnNormal.innerText = 'กำลังวิเคราะห์รอบนี้... ⏳';
            } else {
                btnFinal.innerText = 'กำลังสรุปภาพรวมรายวัน... ⏳';
            }

            const ecInputs = document.querySelectorAll('.runoff-ec');
            const phInputs = document.querySelectorAll('.runoff-ph');
            let runoffList = [];
            for(let i=0; i<ecInputs.length; i++) {
                runoffList.push({ point: i+1, ec: ecInputs[i].value, ph: phInputs[i].value });
            }

            const payload = {
                recorder: document.getElementById('recorderName').value,
                stage: document.getElementById('growthStage').value,
                inflowEC: document.getElementById('inflowEC').value,
                inflowPH: document.getElementById('inflowPH').value,
                runoff: runoffList,
                type: analysisType
            };

            try {
                const response = await fetch('https://cannabis-api.doibudgrower145.workers.dev/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                
                document.getElementById('resultBox').classList.remove('hidden');
                document.getElementById('resultTitle').innerText = analysisType === 'final' 
                    ? '📊 สรุปภาพรวมรายวัน & แผนสำหรับวันพรุ่งนี้' 
                    : '📊 ผลวิเคราะห์รอบนี้ (รอบปกติ)';
                document.getElementById('aiResponseText').innerText = result.aiAnalysis;
                
                // เลื่อนหน้าจอลงมาให้เห็นผลลัพธ์และปุ่มดาวน์โหลดชัดเจน
                document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth' });

            } catch (err) {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อระบบ');
                console.error(err);
            } finally {
                btnNormal.disabled = false;
                btnFinal.disabled = false;
                btnNormal.innerText = '📝 บันทึก & วิเคราะห์รอบนี้ (รอบปกติ)';
                btnFinal.innerText = '🤖 บันทึกรอบสุดท้าย & สรุปภาพรวมรายวัน (วางแผนพรุ่งนี้)';
            }
        }

        // ฟังก์ชันแปลงข้อมูลทั้งหมดตั้งแต่ฟอร์มยันผลวิเคราะห์เป็นรูปภาพ
        function downloadResultImage() {
            const captureElement = document.getElementById('captureArea');
            html2canvas(captureElement, { scale: 2, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = `nutrient-report-${new Date().toISOString().slice(0,10)}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
